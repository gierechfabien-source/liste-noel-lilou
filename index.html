<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noël Lilou</title>
<meta name="theme-color" content="#6aa8ff"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Noël Lilou">
<style>
:root{--bg:#eaf4ff;--card:#fff;--ink:#1d2a4a;--mut:#7384a6;--red:#e0408f;--green:#17a98f;--teal:#3b82f6;--line:#d9e8fb;--blue:#5ab4ff;--violet:#8b5cf6}
*{box-sizing:border-box}
body{background-image:radial-gradient(circle at 12% 18%,#fff 0 2px,transparent 3px),radial-gradient(circle at 88% 30%,#fff 0 2px,transparent 3px);margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:0 0 130px}
header{position:relative;overflow:hidden;min-height:140px;background:linear-gradient(160deg,#7cc8ff 0%,#6aa8ff 45%,#9b7bff 100%);color:#fff;padding:52px 18px 26px;text-align:center}
header.has-img{padding-top:0}
.bnr{display:none;width:calc(100% + 36px);max-width:none;height:auto;max-height:290px;object-fit:cover;object-position:center 25%;margin:0 -18px 14px;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
header.has-img .bnr{display:block}
header>*{position:relative}
.bn{position:absolute;right:10px;top:10px;z-index:2;background:rgba(255,255,255,.9);color:#3b82f6;border:0;border-radius:20px;padding:7px 12px;font-size:12.5px;font-weight:700}
.bx{position:absolute;right:10px;top:46px;z-index:2;background:rgba(255,255,255,.75);color:#d02a7c;border:0;border-radius:20px;padding:5px 10px;font-size:11.5px;display:none}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 10px;color:#1d2a4a}
.sec b{font-size:20px}.sec span{font-size:13px;color:var(--mut)}
header h1{margin:0;font-size:26px;letter-spacing:.2px}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:0 12px}
.tabs{display:flex;gap:8px;background:#fff;padding:6px;border-radius:16px;box-shadow:0 8px 22px rgba(70,110,200,.22);margin-bottom:12px}
.tab{flex:1;border:0;background:transparent;padding:11px 6px;border-radius:11px;font-size:15px;font-weight:700;color:var(--mut)}
.tab.on{background:linear-gradient(135deg,#5ab4ff,#8b5cf6);color:#fff}
.prog{height:8px;background:#cfe2fb;border-radius:8px;overflow:hidden;margin:2px 4px 14px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ab4ff,#e0408f);transition:width .3s}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px 10px 10px;margin-bottom:11px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 3px 12px rgba(70,110,200,.14);border:2px solid transparent;transition:.15s}
.th{flex:none;width:92px;height:92px;object-fit:cover;border-radius:12px;background:#e6f1ff}
.txt{flex:1;min-width:0}
.name{font-weight:700;font-size:15.5px;line-height:1.25}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11.5px;background:#e6f1ff;color:#4a64a0;border-radius:20px;padding:3px 9px}
.price{font-weight:800;font-size:17px;color:var(--red);margin-top:6px}
.lk{display:inline-block;margin-top:5px;font-size:12.5px;color:var(--teal);text-decoration:none;font-weight:600}
.box{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid #b9d3f5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:900}
.item.done{background:#e7f8f4;border-color:#8fdccd}
.item.done .box{background:var(--green);border-color:var(--green)}
.th.off{object-fit:contain;background:#fff;border:1px solid #d9e8fb}
.item.done .th{opacity:.55}
.item.done .name{text-decoration:line-through;color:var(--mut)}
.item.done .price{color:var(--green)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(70,110,200,.14)}
.bar .in{max-width:640px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.st small{display:block;color:var(--mut);font-size:11.5px}
.st b{font-size:17px}
.st .g{color:var(--green)}
.reset{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:13px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);text-align:center;margin:16px 10px}

.ed{flex:none;border:0;background:#e6f1ff;color:#3b82f6;border-radius:50%;width:30px;height:30px;font-size:14px;margin-right:-4px}
.add{display:block;width:100%;border:2px dashed #9cc4f5;background:#fff;color:#3b82f6;border-radius:18px;padding:16px;font-size:15px;font-weight:700;margin:4px 0 8px}
.rst{display:block;margin:6px auto 0;background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline}
.ph{flex:none;width:92px;height:92px;border-radius:12px;background:#e6f1ff;display:flex;align-items:center;justify-content:center;font-size:34px}
.mask{position:fixed;inset:0;background:rgba(20,35,80,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}
.sheet input[type=text],.sheet input[type=number]{width:100%;padding:12px;border:1.5px solid #cfe0f7;border-radius:12px;font-size:16px;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:13px;border-radius:12px;border:0;font-size:15px;font-weight:700}
.b1{background:linear-gradient(135deg,#5ab4ff,#8b5cf6);color:#fff}.b2{background:#eef3fb;color:#4a64a0}.b3{background:#ffe9f2;color:#d02a7c}
.pv{width:70px;height:70px;border-radius:10px;object-fit:contain;background:#e6f1ff;margin-top:6px}

.cnt{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.cnt span{background:rgba(255,255,255,.92);color:#3b82f6;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:800}
.lock{position:absolute;left:10px;top:10px;z-index:2;background:rgba(255,255,255,.9);color:#3b82f6;border:0;border-radius:20px;padding:7px 12px;font-size:12.5px;font-weight:700}
.item.done{background:#f1ecff;border-color:#c9b8ff}
.item.done .th{opacity:.5}
.item.done .name{text-decoration:none;color:var(--ink)}
.res{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;color:#6d3fd8;background:#e9e0ff;border-radius:20px;padding:3px 10px}
.xtra{display:block;width:100%;border:0;background:linear-gradient(135deg,#e0408f,#8b5cf6);color:#fff;border-radius:18px;padding:15px;font-size:15px;font-weight:800;margin:10px 0 8px}
.big{width:100%;max-height:260px;object-fit:contain;background:#fff;border:1px solid #d9e8fb;border-radius:14px}
.sheet .name{font-size:19px;margin:10px 0 2px}
.sheet .tags{margin-bottom:6px}
.sheet .price{margin:6px 0}
.lkb{display:block;text-align:center;text-decoration:none;background:#e6f1ff;color:#3b82f6;border-radius:12px;padding:12px;font-weight:700;margin-top:10px}
.msg{font-size:12.5px;color:var(--mut);text-align:center;margin:8px 4px}
.msg.warn{color:#b4560f;background:#fff4e5;border-radius:12px;padding:10px}
.pl{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:6px 0;font-size:13.5px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.pl button{border:0;background:#ffe9f2;color:#d02a7c;border-radius:8px;padding:6px 9px;font-size:12px}
.sheet h3{margin:16px 0 4px;font-size:14px;color:var(--mut)}
#rw{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(90,180,255,.93),rgba(110,80,230,.95));text-align:center;color:#fff;overflow:hidden}
#rw.on{display:flex}
#rw .in{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both;padding:20px}
#rw .hat{font-size:70px}
#rw h1{font-size:54px;margin:6px 0;letter-spacing:3px;text-shadow:0 4px 0 #3b3fb4,0 8px 18px rgba(0,0,0,.3)}
#rw p{font-size:22px;margin:6px 0;font-weight:700}
#rw small{display:block;margin-top:18px;opacity:.8}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.cf{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>
</head>

<header id="hd"><button class="lock" id="lk">🔒 Édition</button><button class="bn" id="bn" style="display:none">📷 Bandeau</button><button class="bx" id="bx">Retirer</button><input type="file" id="bf" accept="image/*" hidden><img class="bnr" id="bnr" alt=""><h1>☁️ Liste de Noël de Lilou ✦</h1><p>Touche un cadeau pour voir la fiche et le réserver</p><div class="cnt"><span id="c1"></span><span id="c2"></span></div><div><button id="ins" style="display:none;margin-top:10px;border:0;border-radius:20px;padding:8px 16px;background:#e0408f;color:#fff;font-weight:800;font-size:13px">📲 Installer l’application</button></div></header>
<main>
<div class="tabs"><button class="tab" id="tm">🏠 Chez Maman</button><button class="tab" id="tp">🏠 Chez Papa</button></div>
<div class="prog"><i id="pg"></i></div>
<div id="info"></div>
<div id="list"></div>
<button class="xtra" id="xt">🎁 J'ai pris un cadeau qui n'est pas dans la liste</button>
<div id="adm"></div>
<p class="note">Un cadeau réservé est grisé pour que personne ne l'achète en double, même s'il est sur les deux listes.</p>
</main>
<div class="bar"><div class="in">
<div class="st"><small>Cadeaux</small><b id="n1"></b></div>
<div class="st"><small>Déjà réservés</small><b class="g" id="n2"></b></div>
<div class="st" id="tl" style="display:none"><small>Total liste</small><b id="all"></b></div>
</div></div>
<div class="mask" id="mask"><div class="sheet">
<h2 id="mt">Modifier le cadeau</h2>
<label>Nom</label><input type="text" id="fn">
<label>Prix (€) — laisse vide si inconnu</label><input type="number" id="fp" step="0.01" inputmode="decimal">
<label>Détails (séparés par ·) — ex : Dès 8 ans · 626 pièces</label><input type="text" id="fs">
<label>Lien du produit (facultatif)</label><input type="text" id="fu" placeholder="https://…" inputmode="url">
<label>Photo (facultatif)</label><input type="file" id="ff" accept="image/*"><img class="pv" id="pv" alt="">
<div class="row"><button class="b3" id="fd">Supprimer</button><button class="b2" id="fc">Annuler</button><button class="b1" id="fo">Enregistrer</button></div>
</div></div>

const $=id=>document.getElementById(id);
const eur=v=>v.toFixed(2).replace(".",",")+" €";
const base=DATA.flatMap((l,li)=>l.map((it,i)=>({id:li+"-"+i,list:"m",n:it.n,s:it.s,p:it.p,img:PIC[IMG[li][i]],off:OFF.includes(IMG[li][i]),u:LINKS[IMG[li][i]]})))
  .concat(PAPA.map(x=>({id:x.id,list:"p",key:x.k||x.id,also:x.k?"m":"",n:x.n,s:x.s,p:x.p,img:PIC[x.i],off:x.k?OFF.includes(x.i):true,u:LINKS[x.i]})));
base.forEach(b=>{if(b.list==="m"&&PAPA.some(x=>x.k===b.id))b.also="p"});
const LN={m:"Maman",p:"Papa"};
let cur=(location.hash==="#papa"||(()=>{try{return localStorage.getItem("lilouList")==="p"}catch(e){return false}})()&&location.hash!=="#maman")?"p":"m";
const pkey=it=>it.key||it.id;
let db=null,owner=false,edit=false,canW=null,ov={},picks={},extras=[],lockH=null,editing=null,newImg=undefined,sync=false;
function merged(allL){
  const out=[];
  base.forEach(b=>{const o=ov[b.id];if(o&&o.del)return;out.push(o?Object.assign({},b,o,{id:b.id,img:o.img||b.img,off:o.img?true:b.off}):b)});
  Object.keys(ov).filter(k=>!base.some(b=>b.id===k)&&!ov[k].del).sort().forEach(k=>out.push(Object.assign({off:true},ov[k],{id:k})));
  return allL?out:out.filter(x=>(x.list||"m")===cur);
}
function hash(t){let h=5381;for(const c of "noel|"+t)h=((h<<5)+h+c.charCodeAt(0))>>>0;return String(h)}
function shrink(file,max,q,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(file)}
function safeUrl(u){return u&&/^https?:\/\//i.test(u)?u:null}
const wr=async(p,d)=>{try{await db.doc(p).set(d);return true}catch(e){alert("Enregistrement impossible : "+(e&&e.message||e));return false}};
const del=async p=>{try{await db.doc(p).delete();return true}catch(e){alert("Suppression impossible");return false}};

function card(it){
  const pk=picks[pkey(it)];
  const d=document.createElement("div");d.className="item"+(pk?" done":"");
  d.innerHTML=(it.img?'<img class="th'+(it.off?" off":"")+'" alt="" src="'+it.img+'">':'<div class="ph">🎁</div>')+'<div class="txt"><div class="name"></div><div class="tags"></div><div class="price"></div></div>'+(edit?'<button class="ed">✏️</button>':'');
  d.querySelector(".name").textContent=it.n;
  const tg=d.querySelector(".tags");
  (it.s?it.s.split("·").map(x=>x.trim()).filter(Boolean):[]).forEach(t=>{const x=document.createElement("span");x.className="tag";x.textContent=t;tg.appendChild(x)});
  d.querySelector(".price").textContent=it.p!=null?eur(it.p):"Prix à vérifier";
  if(it.also&&!pk){const a=document.createElement("div");a.className="msg";a.style.textAlign="left";a.style.margin="4px 0 0";a.textContent="Aussi sur la liste de "+LN[it.also];d.querySelector(".txt").appendChild(a)}
  if(pk){const r=document.createElement("div");r.className="res";r.textContent="🎁 Déjà réservé";d.querySelector(".txt").appendChild(r)}
  if(edit)d.querySelector(".ed").onclick=e=>{e.stopPropagation();openEd(it)};
  d.onclick=()=>openSheet(it);
  return d;
}
function render(){
  const its=merged(),el=$("list");el.innerHTML="";

  const n=its.length;

  $("pg").style.width=(n?100*r/n:0)+"%";
  $("tl").style.display=edit?"block":"none";
  $("lk").textContent=edit?"🔓 Quitter l'édition":"🔒 Édition";
  $("lk").style.display="block";
  $("bn").style.display=edit?"block":"none";
  $("bx").style.display=edit&&$("hd").classList.contains("has-img")?"block":"none";
  const inf=$("info");inf.innerHTML="";
  if(!db){inf.innerHTML='<p class="msg warn">Connexion à la base impossible : la liste s’affiche mais les réservations sont indisponibles. Recharge la page.</p>'}
  else if(canW===false&&!owner){inf.innerHTML='<p class="msg warn">Pour réserver un cadeau, il faut avoir accès en tant que contributeur à cette page.</p>'}
  renderAdm();
}
function renderAdm(){
  const a=$("adm");a.innerHTML="";if(!edit)return;
  const its=merged(true);
  const h=document.createElement("div");h.className="sheet";h.style.cssText="border-radius:18px;max-width:none;margin-top:8px;padding-bottom:18px";
  h.innerHTML="<h2>👀 Réservations (visible par toi seul)</h2>";
  const ks=Object.keys(picks);
  if(!ks.length)h.insertAdjacentHTML("beforeend",'<p class="msg">Aucune réservation pour le moment.</p>');
  ks.forEach(k=>{const it=its.find(x=>pkey(x)===k);const row=document.createElement("div");row.className="pl";const s=document.createElement("span");s.textContent=(it?it.n:"(cadeau supprimé)")+" → "+(picks[k].name||"?");const b=document.createElement("button");b.textContent="Libérer";b.onclick=()=>del("picks/"+k);row.append(s,b);h.appendChild(row)});
  h.insertAdjacentHTML("beforeend","<h3>Cadeaux hors liste</h3>");
  if(!extras.length)h.insertAdjacentHTML("beforeend",'<p class="msg">Aucun pour le moment.</p>');
  extras.forEach(x=>{const row=document.createElement("div");row.className="pl";const s=document.createElement("span");s.textContent=(x.gift||"Cadeau")+" — "+x.name;if(safeUrl(x.url)){const l=document.createElement("a");l.href=x.url;l.target="_blank";l.rel="noopener";l.textContent=" 🔗";s.appendChild(l)}const b=document.createElement("button");b.textContent="Supprimer";b.onclick=()=>del("extras/"+x.id);row.append(s,b);h.appendChild(row)});
  a.appendChild(h);
}
function closeSh(){$("m2").classList.remove("on")}
$("m2").onclick=e=>{if(e.target===$("m2"))closeSh()};
function openSheet(it){
  const s=$("sh2");s.innerHTML="";
  const pk=picks[pkey(it)];
  if(it.img){const i=document.createElement("img");i.className="big";i.src=it.img;s.appendChild(i)}
  const n=document.createElement("div");n.className="name";n.textContent=it.n;s.appendChild(n);
  const tg=document.createElement("div");tg.className="tags";(it.s?it.s.split("·").map(x=>x.trim()).filter(Boolean):[]).forEach(t=>{const x=document.createElement("span");x.className="tag";x.textContent=t;tg.appendChild(x)});s.appendChild(tg);
  const p=document.createElement("div");p.className="price";p.textContent=it.p!=null?eur(it.p):"Prix à vérifier";s.appendChild(p);
  const u=safeUrl(it.u);
  if(u){const a=document.createElement("a");a.className="lkb";a.href=u;a.target="_blank";a.rel="noopener";a.textContent="🛒 Voir le produit";s.appendChild(a)}
  const g=document.createElement("a");g.className="lkb";g.target="_blank";g.rel="noopener";g.textContent="🔍 Voir d'autres photos";g.href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(it.n+" jouet");s.appendChild(g);
  if(it.also)s.insertAdjacentHTML("beforeend",'<p class="msg">Ce cadeau est aussi sur la liste de '+LN[it.also]+' : s\u2019il est réservé ici, il l\u2019est aussi là-bas.</p>');
  if(pk){s.insertAdjacentHTML("beforeend",'<p class="msg">🎁 Ce cadeau est déjà réservé. Merci !</p>')}
  else if(db&&canW!==false){
    s.insertAdjacentHTML("beforeend",'<label>Ton prénom</label><input type="text" id="pn" maxlength="40" placeholder="Ex : Mamie">');
    const r=document.createElement("div");r.className="row";r.innerHTML='<button class="b2" id="x1">Fermer</button><button class="b1" id="x2">🎁 Je l\'offre</button>';s.appendChild(r);
    r.querySelector("#x1").onclick=closeSh;
    r.querySelector("#x2").onclick=async()=>{const nm=$("pn").value.trim();if(!nm){$("pn").focus();return}
      const b=r.querySelector("#x2");b.disabled=true;
      try{const cur=await db.doc("picks/"+pkey(it)).get();if(cur.exists){alert("Oups, quelqu'un vient de réserver ce cadeau !");b.disabled=false;return}}catch(e){}
      try{await db.doc("picks/"+pkey(it)).set({name:nm,at:Date.now()});closeSh();reward(nm)}catch(e){alert("Oups, ce cadeau vient d'être réservé par quelqu'un d'autre.");b.disabled=false}};
  }else{
    const r=document.createElement("div");r.className="row";r.innerHTML='<button class="b2" id="x1">Fermer</button>';s.appendChild(r);r.querySelector("#x1").onclick=closeSh;
    if(!db||canW===false)s.insertAdjacentHTML("beforeend",'<p class="msg warn">Réservation indisponible pour toi sur cette page.</p>');
  }
  $("m2").classList.add("on");
}
$("xt").onclick=()=>{
  const s=$("sh2");s.innerHTML="<h2>🎁 Un cadeau hors liste</h2>";
  if(!db||canW===false){s.insertAdjacentHTML("beforeend",'<p class="msg warn">Indisponible pour toi sur cette page.</p><div class="row"><button class="b2" id="y1">Fermer</button></div>');s.querySelector("#y1").onclick=closeSh;$("m2").classList.add("on");return}
  s.insertAdjacentHTML("beforeend",'<label>Ton prénom</label><input type="text" id="en" maxlength="40"><label>Quel cadeau ? (facultatif)</label><input type="text" id="eg" maxlength="120"><label>Lien (facultatif)</label><input type="text" id="eu" placeholder="https://…" inputmode="url"><div class="row"><button class="b2" id="y1">Annuler</button><button class="b1" id="y2">Valider</button></div>');
  s.querySelector("#y1").onclick=closeSh;
  s.querySelector("#y2").onclick=async()=>{const nm=$("en").value.trim();if(!nm){$("en").focus();return}
    let u=$("eu").value.trim();if(u&&!/^https?:\/\//i.test(u))u="https://"+u;
    const b=s.querySelector("#y2");b.disabled=true;
    try{await db.collection("extras").add({name:nm,gift:$("eg").value.trim(),url:u,at:Date.now()});closeSh();reward(nm)}catch(e){alert("Enregistrement impossible : "+(e&&e.message||e));b.disabled=false}};
  $("m2").classList.add("on");
};
function reward(nm){
  const rw=$("rw");$("rwp").textContent="Merci "+nm+" 💙 pour Lilou !";
  rw.querySelectorAll(".cf").forEach(x=>x.remove());
  const E=["🎁","⭐","❄️","💙","✨","🎄","🎀"];
  for(let i=0;i<46;i++){const c=document.createElement("span");c.className="cf";c.textContent=E[i%E.length];c.style.left=Math.random()*100+"%";c.style.animationDuration=(2.2+Math.random()*2.5)+"s";c.style.animationDelay=(Math.random()*1.2)+"s";c.style.fontSize=(18+Math.random()*24)+"px";rw.appendChild(c)}
  rw.classList.add("on");clearTimeout(reward.t);reward.t=setTimeout(()=>rw.classList.remove("on"),5200);
}
function setList(l){cur=l;try{localStorage.setItem("lilouList",l)}catch(e){}history.replaceState(null,"",l==="p"?"#papa":"#maman");render();window.scrollTo(0,0)}
$("tm").onclick=()=>setList("m");$("tp").onclick=()=>setList("p");
$("rw").onclick=()=>$("rw").classList.remove("on");

// édition (propriétaire)
$("lk").onclick=()=>{
  if(edit){edit=false;render();return}
  if(!db||!FBA){alert("Connexion indisponible pour le moment");return}
  const go=async u=>{
    if(hash((u.email||"").toLowerCase())!==OWNER_H){try{await FBA.Au.signOut(FBA.auth)}catch(e){}alert("Accès réservé au propriétaire de la liste");return}
    owner=true;
    const c=prompt(lockH?"Code d'édition :":"Choisis un code d'édition (4 caractères minimum) :");
    if(c===null)return;
    if(lockH){if(hash(c)!==lockH){alert("Code incorrect");return}}
    else{if(c.length<4){alert("Code trop court");return}if(!await wr("cfg/lock",{h:hash(c)}))return}
    edit=true;render();
  };
  if(FBA.auth.currentUser){go(FBA.auth.currentUser);return}
  FBA.Au.signInWithPopup(FBA.auth,new FBA.Au.GoogleAuthProvider()).then(r=>go(r.user)).catch(()=>alert("Connexion Google impossible (fenêtre bloquée ?)"));
};
function openEd(it){
  editing=it;newImg=undefined;
  $("mt").textContent=it?"Modifier le cadeau":"Nouveau cadeau";
  $("fn").value=it?it.n:"";$("fp").value=it&&it.p!=null?it.p:"";$("fs").value=it?it.s||"":"";$("fu").value=it?it.u||"":"";
  $("ff").value="";$("pv").src=it&&it.img?it.img:"";$("pv").style.display=it&&it.img?"block":"none";
  $("fd").style.display=it?"block":"none";$("mask").classList.add("on");
}
const closeEd=()=>$("mask").classList.remove("on");
$("fc").onclick=closeEd;
$("mask").onclick=e=>{if(e.target===$("mask"))closeEd()};
$("ff").onchange=e=>{const f=e.target.files[0];if(!f)return;shrink(f,260,.8,u=>{newImg=u;$("pv").src=u;$("pv").style.display="block"})};
$("fo").onclick=async()=>{
  const n=$("fn").value.trim();if(!n){$("fn").focus();return}
  const pv=$("fp").value.trim(),p=pv===""?null:parseFloat(pv.replace(",","."));
  let u=$("fu").value.trim();if(u&&!/^https?:\/\//i.test(u))u="https://"+u;
  const o={n,p:isNaN(p)?null:p,s:$("fs").value.trim(),u:u||""};
  const id=editing?editing.id:"n"+Date.now();o.list=editing?(editing.list||"m"):cur;
  const prev=ov[id]||{};
  const img=newImg||prev.img;if(img)o.img=img;
  if(await wr("items/"+id,o))closeEd();
};
$("fd").onclick=async()=>{if(!editing||!confirm("Supprimer ce cadeau ?"))return;
  const id=editing.id;const ok=base.some(b=>b.id===id)?await wr("items/"+id,{del:true}):await del("items/"+id);if(ok)closeEd()};
function setBanner(u){const h=$("hd");if(u){$("bnr").src=u;h.classList.add("has-img")}else{$("bnr").removeAttribute("src");h.classList.remove("has-img")}}
$("bn").onclick=()=>$("bf").click();
$("bf").onchange=e=>{const f=e.target.files[0];if(!f)return;shrink(f,1000,.72,u=>{if(u.length>230000)return alert("Image trop lourde, choisis-en une plus petite");wr("cfg/banner",{u})})};
$("bx").onclick=()=>del("cfg/banner");

let dip=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(!standalone())$("ins").style.display="inline-block";
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e});
addEventListener("appinstalled",()=>{$("ins").style.display="none"});

  if(dip){dip.prompt();try{await dip.userChoice}catch(e){}dip=null;return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const s=$("sh2");s.innerHTML='<h2>📲 Installer Noël Lilou</h2><p class="msg" style="text-align:left;font-size:14px;color:#1d2a4a">'+(ios?"Sur iPhone / iPad (dans Safari) : touche le bouton <b>Partager</b> (carré avec une flèche), puis <b>Sur l’écran d’accueil</b>.":"Dans le menu de ton navigateur (⋮ ou ⋯), choisis <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b>.")+'</p><div class="row"><button class="b2" id="z1">Fermer</button></div>';
  s.querySelector("#z1").onclick=closeSh;$("m2").classList.add("on");
};

const FBC={apiKey:"AIzaSyBYNEjVg4wrSLJRo6wMXl_Hd9lb2JDeHO0",authDomain:"liste-noel-lilou.firebaseapp.com",projectId:"liste-noel-lilou",storageBucket:"liste-noel-lilou.firebasestorage.app",messagingSenderId:"1037196943479",appId:"1:1037196943479:web:540fcf7d56f238043a2672"};
const OWNER_H="418829104";
let FBA=null;
(async()=>{
  try{
    const b="https://www.gstatic.com/firebasejs/10.14.1/";
    const [A,F,Au]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-firestore.js"),import(b+"firebase-auth.js")]);
    const app=A.initializeApp(FBC),fs=F.getFirestore(app),auth=Au.getAuth(app);
    FBA={Au,auth};
    db={doc:p=>({get:async()=>{const x=await F.getDoc(F.doc(fs,p));return{exists:x.exists(),data:()=>x.data()}},set:d=>F.setDoc(F.doc(fs,p),d),delete:()=>F.deleteDoc(F.doc(fs,p))}),
       collection:c=>({add:d=>F.addDoc(F.collection(fs,c),d),onSnapshot:(n,e)=>F.onSnapshot(F.collection(fs,c),x=>n({docs:x.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e)})};
  }catch(e){console.warn(e)}
  render();
  if(!db)return;
  const fail=e=>{console.warn(e)};
  const slow=setTimeout(()=>{$("info").insertAdjacentHTML("afterbegin",'<p class="msg">Synchronisation lente… les réservations peuvent ne pas être à jour.</p>')},10000);
  const ok=()=>{if(!sync){sync=true;clearTimeout(slow);const m=$("info").querySelector(".msg:not(.warn)");if(m)m.remove()}};
  db.collection("items").onSnapshot(x=>{ov={};x.docs.forEach(d=>ov[d.id]=d.data());ok();render()},fail);
  db.collection("picks").onSnapshot(x=>{picks={};x.docs.forEach(d=>picks[d.id]=d.data());ok();render()},fail);
  db.collection("extras").onSnapshot(x=>{extras=x.docs.map(d=>Object.assign({id:d.id},d.data())).sort((p,q)=>(p.at||0)-(q.at||0));render()},fail);
  db.collection("cfg").onSnapshot(x=>{lockH=null;let bn=null;x.docs.forEach(d=>{if(d.id==="lock")lockH=d.data().h;if(d.id==="banner")bn=d.data().u});setBanner(bn);render()},fail);
})();
